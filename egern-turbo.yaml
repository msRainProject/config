# =====================================
# General - 基础设置
# =====================================
ipv6: false
vif_only: true
hide_vpn_icon: false
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://cp.cloudflare.com/generate_204
direct_latency_test_url: http://connectivitycheck.platform.hicloud.com/generate_204
compat_route: false
vif_excluded_routes:
- 172.16.0.0/12
- 10.0.0.0/8
- 192.168.0.0/16
# =====================================
# DNS - 域名解析设置
# =====================================
dns:
  bootstrap:
  - 223.5.5.5
  - 119.29.29.29
  upstreams:
    China:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    Global:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  forward:
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/ChinaMax.lsr
      value: China
      disabled: false
  - proxy_rule_set:
      match: https://ruleset.skk.moe/List/non_ip/apple_cn.conf
      value: China
      disabled: false
  - proxy_rule_set:
      match: https://ruleset.skk.moe/List/non_ip/apple_services.conf
      value: China
      disabled: false
  - proxy_rule_set:
      match: https://ruleset.skk.moe/List/non_ip/apple_cdn.conf
      value: China
      disabled: false
  - proxy_rule_set:
      match: https://ruleset.skk.moe/List/domainset/apple_cdn.conf
      value: China
      disabled: false
  - domain_wildcard:
      match: '*'
      value: Global
      disabled: false
# =====================================
# Policy Groups - 策略组
# =====================================
policy_groups:
- external:
    name: Proxy
    type: select
    urls:
    - ${proxy_backend_addr}
    filter: .*
    update_interval: 7200
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Urltest.png
    hidden: false
- select:
    name: Ai
    policies:
    - Proxy
    flatten: true
    filter: ^(?!.*(HK|MACAU|DEBA))
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
    hidden: false
- select:
    name: Spotify
    policies:
    - Proxy
    flatten: true
    filter: US|PHX
    icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/Spotify_01.png
    hidden: false
- select:
    name: ChinaMedia
    policies:
    - Proxy
    - DIRECT
    flatten: true
    filter: .*
    icon: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/StreamingSE.png
    hidden: false
# =====================================
# Rules - 分流规则
# =====================================
rules:
- ip_cidr:
    name: Reject-IP
    match: 5.28.195.0/24
    policy: REJECT
    no_resolve: false
    disabled: false
- rule_set:
    name: AI
    match: https://kelee.one/Tool/Loon/Lsr/AI.lsr
    policy: Ai
    disabled: false
- rule_set:
    name: Spotify
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Spotify/Spotify.list
    policy: Proxy
    disabled: false
- rule_set:
    name: douyin
    match: https://github.com/fmz200/wool_scripts/raw/main/Loon/rule/Douyin.list
    policy: ChinaMedia
    disabled: false
- rule_set:
    name: rednote
    match: https://github.com/fmz200/wool_scripts/raw/main/Loon/rule/RedBook.list
    policy: DIRECT
    disabled: false
- rule_set:
    name: Wechat
    match: https://github.com/blackmatrix7/ios_rule_script/raw/master/rule/Loon/WeChat/WeChat.list
    policy: DIRECT
    disabled: false
- rule_set:
    name: China-IP
    match: https://ruleset.skk.moe/List/ip/china_ip.conf
    policy: DIRECT
    disabled: false
- rule_set:
    name: China-IPv6
    match: https://ruleset.skk.moe/List/ip/china_ip_ipv6.conf
    policy: DIRECT
    disabled: false
- rule_set:
    name: Apple-CDN-DomainSet
    match: https://ruleset.skk.moe/List/domainset/apple_cdn.conf
    policy: DIRECT
    disabled: false
- rule_set:
    name: Apple-CDN
    match: https://ruleset.skk.moe/List/non_ip/apple_cdn.conf
    policy: DIRECT
    disabled: false
- rule_set:
    name: Apple-CN
    match: https://ruleset.skk.moe/List/non_ip/apple_cn.conf
    policy: DIRECT
    disabled: false
- rule_set:
    name: Apple-Services
    match: https://ruleset.skk.moe/List/non_ip/apple_services.conf
    policy: DIRECT
    disabled: false
- default:
    name: Proxy
    policy: Proxy
# =====================================
# MITM
# =====================================
mitm:
  ca_p12: 
  ca_passphrase: egern
