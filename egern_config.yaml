# =====================================
# General - 基础设置
# =====================================
ipv6: false
vif_only: true
hide_vpn_icon: false
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: https://www.apple.com/library/test/success.html
direct_latency_test_url: http://wifi.vivo.com.cn/generate_204
compat_route: false
vif_excluded_routes:
- 172.16.0.0/12
- 10.0.0.0/8
- 192.168.0.0/16
# =====================================
# DNS - 域名解析设置
# =====================================
dns:
  bootstrap:
  - 8.8.8.8
  - 223.5.5.5
  - 1.1.1.1
  upstreams:
    谷歌:
    - https://8.8.8.8/dns-query
    Global:
    - https://8.8.8.8/dns-query
    - https://1.1.1.1/dns-query
    China:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    腾讯:
    - https://doh.pub/dns-query
    阿里:
    - https://dns.alidns.com/dns-query
    字节:
    - 180.184.2.2
    - 180.184.1.1
  forward:
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/YouTube.lsr
      value: 谷歌
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/Google.lsr
      value: 谷歌
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/DouYin.lsr
      value: 字节
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/TestFlight.lsr
      value: Global
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/Apple.lsr
      value: China
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/Alibaba.lsr
      value: 阿里
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/Tencent.lsr
      value: 腾讯
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/ChinaMax.lsr
      value: China
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/Global.lsr
      value: Global
      disabled: false
  - domain_wildcard:
      match: '*'
      value: Global
      disabled: false
  public_ip_lookup_url: https://ifconfig.me/ip
# =====================================
# Policy Groups - 策略组
# 应用策略组：用户可见，手动选择地区
# 地区策略组：手自一体 fallback，自动测速 + 手动选择
# 国内应用策略组：直连
# =====================================
policy_groups:
# --- 外部订阅源 ---
- external:
    name: Proxy
    type: select
    urls:
    - ${proxy_backend_addr}
    filter: ^(?!.*(重置|试用|过期| Date|过期|GB|Day|到期|维护|失效|演示|官方|免费|流量|剩余|已用|跑路|待补|补货|停用|禁售|禁用|故障|测速|备用|应急|落地|回程|中继|Relay|Tunnel|游戏|专线|备用|待续| Construction|Expired|Free|Trial|Test|Demo|Maintain|Outage|Sold.?Out|Closed)).*(?!^$)
    update_interval: 7200
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/02ProxySoftLogo/Egern.png
    hidden: false
# --- 应用策略组 (select) ---
